# Vocabulaire de Milo. Les clés sont ce que l'on dit, écrit normalement avec
# accents (elles servent aussi de vocabulaire à la reconnaissance vocale).
# Les valeurs sont ce que Milo ouvre.

# « Ouvre les paramètres <page> »  ->  page des Paramètres Windows (ms-settings:)
[parametres]
"wifi" = "ms-settings:network-wifi"
"réseau" = "ms-settings:network"
"internet" = "ms-settings:network"
"mode avion" = "ms-settings:network-airplanemode"
"vpn" = "ms-settings:network-vpn"
"bluetooth" = "ms-settings:bluetooth"
"périphériques" = "ms-settings:bluetooth"
"imprimantes" = "ms-settings:printers"
"souris" = "ms-settings:mousetouchpad"
"pavé tactile" = "ms-settings:devices-touchpad"
"son" = "ms-settings:sound"
"audio" = "ms-settings:sound"
"affichage" = "ms-settings:display"
"écran" = "ms-settings:display"
"luminosité" = "ms-settings:display"
"alimentation" = "ms-settings:powersleep"
"batterie" = "ms-settings:batterysaver"
"mise en veille" = "ms-settings:powersleep"
"notifications" = "ms-settings:notifications"
"stockage" = "ms-settings:storagesense"
"applications" = "ms-settings:appsfeatures"
"applications par défaut" = "ms-settings:defaultapps"
"démarrage" = "ms-settings:startupapps"
"comptes" = "ms-settings:yourinfo"
"date et heure" = "ms-settings:dateandtime"
"langue" = "ms-settings:regionlanguage"
"clavier" = "ms-settings:keyboard"
"personnalisation" = "ms-settings:personalization"
"fond d'écran" = "ms-settings:personalization-background"
"couleurs" = "ms-settings:colors"
"mode sombre" = "ms-settings:colors"
"accessibilité" = "ms-settings:easeofaccess"
"narrateur" = "ms-settings:easeofaccess-narrator"
"loupe" = "ms-settings:easeofaccess-magnifier"
"contraste" = "ms-settings:easeofaccess-highcontrast"
"taille du texte" = "ms-settings:easeofaccess-display"
"curseur" = "ms-settings:easeofaccess-cursor"
"sous-titres" = "ms-settings:easeofaccess-closedcaptioning"
"reconnaissance vocale" = "ms-settings:speech"
"confidentialité" = "ms-settings:privacy"
"microphone" = "ms-settings:privacy-microphone"
"caméra" = "ms-settings:privacy-webcam"
"mise à jour" = "ms-settings:windowsupdate"
"windows update" = "ms-settings:windowsupdate"
"sécurité" = "windowsdefender:"
"à propos" = "ms-settings:about"
"système" = "ms-settings:about"

# « Ouvre <nom> »  ->  raccourcis prioritaires sur les applis du menu Démarrer.
# La valeur peut être un exécutable, un chemin, une URL ou un lien « shell: ».
[applications]
"bloc-notes" = "notepad.exe"
"calculatrice" = "calc.exe"
"explorateur" = "explorer.exe"
"explorateur de fichiers" = "explorer.exe"
"mes documents" = "shell:Personal"
"téléchargements" = "shell:Downloads"
"bureau" = "shell:Desktop"
"invite de commandes" = "cmd.exe"
"gestionnaire des tâches" = "taskmgr.exe"
"paint" = "mspaint.exe"
"narrateur" = "narrator.exe"
"loupe" = "magnify.exe"
"clavier visuel" = "osk.exe"
"panneau de configuration" = "control.exe"
"corbeille" = "shell:RecycleBinFolder"
